# Local MongoDB for development only.
# Production should use a managed MongoDB (MongoDB Atlas, etc.) via MONGODB_URI.
services:
  mongodb:
    image: mongo:7
    container_name: spendly-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
